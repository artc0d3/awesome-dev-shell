# Switch panes using Ctrl-direction without prefix (uses VIM direction keys)
# Smart pane switching with awareness of Neovim splits.
bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l'  'select-pane -R'

# Pane resizing via <prefix> H|J|K|L
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Switch windows without the prefix: Alt+<digit> jumps to window N (the `=`
# makes the target an exact index), Alt+Shift+h/l steps to the previous/next
# window, mirroring Shift+h/l for buffers in Neovim. Lowercase Alt+hjkl is left
# free for smart-splits' optional resize bindings. On macOS the terminal must
# send Option as Alt/Meta for these to reach tmux.
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-H previous-window
bind -n M-L next-window

# Split panes using h and v
bind h split-window -h
unbind '"'
bind v split-window -v
unbind %

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use 1 as the first window and pane index
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed, so the sequence stays gapless (1, 2, 3)
set -g renumber-windows on

# Name windows after the active pane's command plus the leaf directory of its
# working directory, e.g. "nvim (awesome-dev-shell)". `b:` is tmux's basename
# modifier. Applies only while automatic-rename is on (the default); renaming a
# window by hand turns it off for that window.
set -g automatic-rename-format '#{pane_current_command} (#{b:pane_current_path})'

# Faster command sequences
set -s escape-time 0

# Higher timeout for pane selection via <prefix> q
set -g display-panes-time 3000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# More colors!
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Styling

# Styling: status line background
set -g status-style "bg=default fg=#a0a9cb"
set -g window-status-current-style "bg=#769ff0 fg=#1d2230 bold" # Active window: blue block, dark text
set -g window-status-current-format " #I:#W "
set -g window-status-style "bg=default fg=#a0a9cb" # Inactive windows: transparent bg, muted lavender text
set -g window-status-format " #I:#W "

# Status bar content
set -g status-left '#[fg=#9ece6a,bold] #S #[fg=#394260]│ '
set -g status-right '#[fg=#394260]│#[fg=#a0a9cb] %H:%M #[fg=#394260]│#[fg=#a0a9cb] %d-%b-%y '

# Styling: Panes
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g pane-active-border-style "fg=#769ff0"
